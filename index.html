<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- For the iPhone home screen: the icon, and opening without Safari's
         bars. The bar colours follow the page's light and dark grounds. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tideline" />
    <meta
      name="theme-color"
      content="#eef2f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1d28"
      media="(prefers-color-scheme: dark)"
    />
    <title>Tideline</title>
    <meta
      name="description"
      content="Tonight's sunset and moon, and today's tide with the observed water level drawn over the prediction, for Campus Point in Santa Barbara."
    />
    <!-- What a pasted link shows. The image address has to be a full one, so
         it names the live site. The picture's source is docs/link-preview.svg. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tideline" />
    <meta
      property="og:description"
      content="Tonight's sunset and moon, and today's tide with the observed water level drawn over the prediction, for Campus Point in Santa Barbara."
    />
    <meta property="og:url" content="https://tideline.ibuild4you.com/" />
    <meta
      property="og:image"
      content="https://tideline.ibuild4you.com/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A day's tide curve at Campus Point, with the observed water level above the prediction and lines marking moonrise and sunset."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
